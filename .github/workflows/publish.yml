name: Publish

# Publishes the npm package and the MCP Registry entry from one tag.
# Tag with the version, e.g.  git tag v0.1.1 && git push origin v0.1.1
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm install
      - run: npm test

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          SRV=$(node -p "require('./server.json').version")
          PKG_IN_SRV=$(node -p "require('./server.json').packages[0].version")
          echo "tag=$TAG package.json=$PKG server.json=$SRV server.json.packages[0]=$PKG_IN_SRV"
          test "$TAG" = "$PKG" || { echo "::error::tag does not match package.json version"; exit 1; }
          test "$TAG" = "$SRV" || { echo "::error::tag does not match server.json version"; exit 1; }
          test "$TAG" = "$PKG_IN_SRV" || { echo "::error::tag does not match server.json packages[0].version"; exit 1; }

      - name: Check mcpName matches server.json name
        run: |
          MCP_NAME=$(node -p "require('./package.json').mcpName")
          SRV_NAME=$(node -p "require('./server.json').name")
          test "$MCP_NAME" = "$SRV_NAME" || { echo "::error::package.json mcpName must equal server.json name"; exit 1; }

      # Skipped when the version is already on npm, so a failed run can be
      # re-run without dying on EPUBLISHCONFLICT before it reaches the registry.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@youricp/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "@youricp/mcp@$VERSION already on npm, skipping publish"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The registry verifies the npm version exists before accepting the entry,
      # and npm's read replicas lag publishes by a few minutes.
      - name: Wait for npm to propagate
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null "https://registry.npmjs.org/@youricp/mcp/$VERSION"; then
              echo "$VERSION visible on npm"; exit 0
            fi
            echo "waiting for $VERSION to appear on npm..."; sleep 15
          done
          echo "::error::npm did not surface $VERSION within 10 minutes"; exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      # Namespace is com.youricp/*, so CI authenticates by DNS, not GitHub OIDC.
      # MCP_REGISTRY_DNS_KEY is the 64-char hex Ed25519 private key whose public
      # half is published in the youricp.com TXT record.
      - name: Publish to the MCP Registry
        run: |
          mcp-publisher login dns \
            --domain=youricp.com \
            --private-key="${{ secrets.MCP_REGISTRY_DNS_KEY }}"
          mcp-publisher publish
